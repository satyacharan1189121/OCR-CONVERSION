<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cortex OCR Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #020202;
            --text-base: #ffffff;
            --glass-bg: rgba(10, 10, 10, 0.45);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-highlight: rgba(255, 255, 255, 0.03);
            --accent: #ffffff;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg-base);
            color: var(--text-base);
            margin: 0;
            overflow-x: hidden;
            min-height: 100vh;
            letter-spacing: -0.015em;
        }

        /* 3D Particle & Liquid Metal Background Canvas */
        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            pointer-events: none;
        }

        /* Premium Glassmorphic Panels */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.6), inset 0 1px 0 var(--glass-highlight);
            transition: all 0.5s cubic-bezier(0.19, 1, 0.22, 1);
            position: relative;
            overflow: hidden;
        }

        .glass-panel::before {
            content: '';
            position: absolute;
            top: 0;
            left: -50%;
            width: 200%;
            height: 100%;
            background: radial-gradient(circle at center, rgba(255, 255, 255, 0.03) 0%, transparent 60%);
            opacity: 0;
            transition: opacity 0.4s ease;
            pointer-events: none;
        }

        .glass-panel:hover {
            border-color: rgba(255, 255, 255, 0.15);
            box-shadow: 0 50px 100px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        .glass-panel:hover::before {
            opacity: 1;
        }

        /* Tabs System */
        .tab-track {
            background: rgba(15, 15, 15, 0.6);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 40px;
            padding: 6px;
            display: inline-flex;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            position: relative;
        }

        .tab-btn {
            padding: 12px 36px;
            font-weight: 500;
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.5);
            border-radius: 30px;
            transition: all 0.4s cubic-bezier(0.19, 1, 0.22, 1);
            position: relative;
            z-index: 2;
        }

        .tab-btn.active {
            color: #000000;
            background: #ffffff;
            box-shadow: 0 8px 20px rgba(255, 255, 255, 0.2);
        }

        .tab-btn:not(.active):hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.05);
        }

        /* Primary Action Button */
        .btn-glow {
            width: 100%;
            padding: 16px;
            border-radius: 16px;
            background: linear-gradient(135deg, #ffffff 0%, #d4d4d4 100%);
            color: #000;
            font-weight: 600;
            font-size: 1.1rem;
            border: 1px solid #ffffff;
            transition: all 0.4s cubic-bezier(0.19, 1, 0.22, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 30px rgba(255, 255, 255, 0.15);
        }

        .btn-glow:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 15px 40px rgba(255, 255, 255, 0.25);
            background: linear-gradient(135deg, #ffffff 0%, #e0e0e0 100%);
        }

        .btn-glow:active:not(:disabled) {
            transform: scale(0.98);
        }

        .btn-glow:disabled {
            background: rgba(30, 30, 30, 0.8);
            color: rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.1);
            box-shadow: none;
            cursor: not-allowed;
        }

        /* Work Areas Inside Panels */
        .workspace {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .workspace:hover {
            border-color: rgba(255, 255, 255, 0.1);
        }

        .icon-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.6);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .icon-btn:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.15);
            color: #ffffff;
            border-color: rgba(255, 255, 255, 0.2);
            transform: scale(1.05);
        }

        #handwritingCanvas {
            cursor: crosshair;
            touch-action: none;
        }

        .drop-zone {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 280px;
            cursor: pointer;
            border: 1px dashed rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            transition: all 0.3s ease;
        }

        .drop-zone:hover,
        .drop-zone.active {
            border-color: rgba(255, 255, 255, 0.5);
            background: rgba(255, 255, 255, 0.02);
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 4px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.4);
        }

        /* Loader */
        .spinner {
            width: 24px;
            height: 24px;
            border: 2px solid rgba(0, 0, 0, 0.1);
            border-top-color: #000;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .spinner.light {
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Title Reveal */
        .title-gradient {
            background: linear-gradient(180deg, #ffffff 0%, #666666 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-size: clamp(3rem, 8vw, 6rem);
            font-weight: 700;
            letter-spacing: -0.04em;
            margin: 0;
            filter: drop-shadow(0 10px 20px rgba(255, 255, 255, 0.1));
            opacity: 0;
            animation: reveal 1.5s cubic-bezier(0.19, 1, 0.22, 1) forwards;
        }

        @keyframes reveal {
            0% {
                opacity: 0;
                transform: translateY(30px) scale(0.95);
                filter: blur(10px);
            }

            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
                filter: blur(0);
            }
        }

        .fade-up {
            opacity: 0;
            transform: translateY(20px);
            animation: fadeUp 1s cubic-bezier(0.19, 1, 0.22, 1) forwards;
        }

        @keyframes fadeUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body class="flex flex-col items-center justify-center p-4 sm:p-8 min-h-screen">

                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-xl font-semibold text-white/90">Extraction Array</h2>
                    <button id="copyButton" onclick="copyText()" class="icon-btn hover:bg-white/10" disabled
                        title="Copy to Clipboard">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>

                <div class="flex-grow relative workspace border-none bg-black/20 group">

                            Processing Block</p>

                    <!-- Results Output -->

                        class="absolute inset-0 text-white/80 text-[15px] whitespace-pre-wrap font-sans leading-relaxed overflow-y-auto hidden p-6 font-light"></pre>

                    <!-- Empty State -->

                            Awaiting<br />Input Vector</p>

                <div id="errorDisplay"
                    class="mt-4 text-xs font-mono uppercase tracking-widest text-[#ff4a4a] text-center hidden p-3 bg-[#ff4a4a]/10 border border-[#ff4a4a]/20 rounded-lg">
                    <span id="errorText"></span>

    <script>
        /**
         * 3D Metallic Particle & Wave Vector Background
         * High-End White/Black Gradient fluid dynamics combined with cursor interaction.
         */
        const canvasBg = document.getElementById('bg-canvas');
        const ctxBg = canvasBg.getContext('2d');
        let width, height;

        // Interaction pointer
        let pointer = { x: -1000, y: -1000, radius: 250 };

        window.addEventListener('mousemove', (e) => {
            pointer.x = e.clientX;
            pointer.y = e.clientY;
        });

        // Resize with device pixel ratio for ultimate crispness
        function resizeBg() {
            width = window.innerWidth;
            height = window.innerHeight;
            const dpr = window.devicePixelRatio || 1;
            canvasBg.width = width * dpr;
            canvasBg.height = height * dpr;
            ctxBg.scale(dpr, dpr);
            initParticles();
        }
        window.addEventListener('resize', resizeBg);

        // Particle Class
        class NodeParticle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.size = Math.random() * 1.5 + 0.5;
                this.baseX = this.x;
                this.baseY = this.y;
                this.density = (Math.random() * 40) + 1;
                // Silvers & Whites
                const colors = ['rgba(255,255,255,0.8)', 'rgba(200,200,200,0.6)', 'rgba(150,150,150,0.5)'];
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.vx = (Math.random() - 0.5) * 0.5;
                this.vy = (Math.random() - 0.5) * 0.5;
            }

            draw() {
                ctxBg.fillStyle = this.color;
                ctxBg.beginPath();
                ctxBg.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctxBg.closePath();
                ctxBg.fill();
            }

            update() {
                // Natural movement
                this.x += this.vx;
                this.y += this.vy;

                // Bounce off edges smoothly
                if (this.x >= width) { this.x = width; this.vx = -Math.abs(this.vx); }
                else if (this.x <= 0) { this.x = 0; this.vx = Math.abs(this.vx); }

                if (this.y >= height) { this.y = height; this.vy = -Math.abs(this.vy); }
                else if (this.y <= 0) { this.y = 0; this.vy = Math.abs(this.vy); }

                // Cursor Interaction
                let dx = pointer.x - this.x;
                let dy = pointer.y - this.y;
                let distance = Math.sqrt(dx * dx + dy * dy);
                let forceDirectionX = dx / distance;
                let forceDirectionY = dy / distance;
                let maxDistance = pointer.radius;
                let force = (maxDistance - distance) / maxDistance;
                let directionX = forceDirectionX * force * this.density;
                let directionY = forceDirectionY * force * this.density;

                // Repel effect
                if (distance < pointer.radius) {
                    this.x -= directionX * 0.5;
                    this.y -= directionY * 0.5;
                }
            }
        }

        let particlesArray = [];
        function initParticles() {
            particlesArray = [];
            let numNodes = Math.min((width * height) / 8000, 300);
            for (let i = 0; i < numNodes; i++) {
                particlesArray.push(new NodeParticle());
            }
        }

        let timeOffset = 0;

        function drawMetallicFluid(time) {
            let grd = ctxBg.createLinearGradient(0, 0, width, height);

            let shift1 = Math.sin(timeOffset * 0.005) * 0.2;
            let shift2 = Math.cos(timeOffset * 0.003) * 0.2;

            grd.addColorStop(0, '#000000');
            grd.addColorStop(Math.abs(0.2 + shift1), '#050505');
            grd.addColorStop(Math.abs(0.5 + shift2), '#0a0a0a');
            grd.addColorStop(Math.abs(0.8 - shift1), '#030303');
            grd.addColorStop(1, '#000000');

            ctxBg.fillStyle = grd;
            ctxBg.fillRect(0, 0, width, height);

            let spotGrd = ctxBg.createRadialGradient(pointer.x, pointer.y, 0, pointer.x, pointer.y, 600);
            spotGrd.addColorStop(0, 'rgba(25, 25, 25, 0.08)');
            spotGrd.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctxBg.globalCompositeOperation = 'screen';
            ctxBg.fillStyle = spotGrd;
            ctxBg.fillRect(0, 0, width, height);
            ctxBg.globalCompositeOperation = 'source-over';
        }

        function animateBg() {
            ctxBg.clearRect(0, 0, width, height);
            drawMetallicFluid(timeOffset);

            for (let i = 0; i < particlesArray.length; i++) {
                particlesArray[i].update();
                particlesArray[i].draw();
            }

            for (let a = 0; a < particlesArray.length; a++) {
                for (let b = a; b < particlesArray.length; b++) {
                    let dx = particlesArray[a].x - particlesArray[b].x;
                    let dy = particlesArray[a].y - particlesArray[b].y;
                    let distance = dx * dx + dy * dy;

                    if (distance < 15000) {
                        let opacity = 1 - (distance / 15000);
                        ctxBg.strokeStyle = `rgba(255, 255, 255, ${opacity * 0.3})`;
                        ctxBg.lineWidth = 0.5;
                        ctxBg.beginPath();
                        ctxBg.moveTo(particlesArray[a].x, particlesArray[a].y);
                        ctxBg.lineTo(particlesArray[b].x, particlesArray[b].y);
                        ctxBg.stroke();
                    }
                }
            }

            timeOffset++;
            requestAnimationFrame(animateBg);
        }

        resizeBg();
        initParticles();
        animateBg();

        // --- APPLICATION LOGIC ---
        let imageBase64 = null;
        let fileMimeType = null;
        let currentMode = 'handwriting';
        let videoStream = null;
        const API_URL = '/run-ocr';

        const dom = {
            fileInput: document.getElementById('fileInput'),
            imagePreview: document.getElementById('imagePreview'),
            imagePreviewContainer: document.getElementById('imagePreviewContainer'),
            ocrButton: document.getElementById('ocrButton'),
            loading: document.getElementById('loading'),
            dropArea: document.getElementById('drop-area'),
            copyButton: document.getElementById('copyButton'),
            errorDisplay: document.getElementById('errorDisplay'),
            errorText: document.getElementById('errorText'),
            results: document.getElementById('results'),
            emptyState: document.getElementById('emptyState'),
            modeUpload: document.getElementById('mode-upload'),
            modeHandwriting: document.getElementById('mode-handwriting'),
            modeCamera: document.getElementById('mode-camera'),
            handwritingCanvas: document.getElementById('handwritingCanvas'),
            videoElement: document.getElementById('videoElement'),
            cameraCanvas: document.getElementById('cameraCanvas'),
            snapshotButton: document.getElementById('snapshotButton'),
            cameraStatus: document.getElementById('cameraStatus'),
            snapshotOverlay: document.getElementById('snapshotOverlay'),
            statusIndicator: document.getElementById('status-indicator')
        };

        const canvasPad = dom.handwritingCanvas;
        const ctxPad = canvasPad.getContext('2d');
        let isDrawing = false;

        function resizeCanvasToDisplaySize() {
            const rect = canvasPad.parentElement.getBoundingClientRect();
            if (canvasPad.width !== rect.width || canvasPad.height !== rect.height) {
                const tempCanvas = document.createElement('canvas');
                tempCanvas.width = canvasPad.width;
                tempCanvas.height = canvasPad.height;
                tempCanvas.getContext('2d').drawImage(canvasPad, 0, 0);

                canvasPad.width = rect.width;
                canvasPad.height = rect.height;

                setupCanvasStyles();
                ctxPad.drawImage(tempCanvas, 0, 0, tempCanvas.width, tempCanvas.height, 0, 0, canvasPad.width, canvasPad.height);
            }
        }

        function setupCanvasStyles() {
            ctxPad.lineCap = 'round';
            ctxPad.lineJoin = 'round';
            ctxPad.lineWidth = 4;
            ctxPad.strokeStyle = '#ffffff';
            ctxPad.shadowBlur = 4;
            ctxPad.shadowColor = '#ffffff';

            if (!isDrawing && !imageBase64) {
                ctxPad.clearRect(0, 0, canvasPad.width, canvasPad.height);
            }
        }

        function getMousePos(canvasDom, e) {
            const rect = canvasDom.getBoundingClientRect();
            let clientX = e.touches ? e.touches[0].clientX : e.clientX;
            let clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: (clientX - rect.left) * (canvasDom.width / rect.width),
                y: (clientY - rect.top) * (canvasDom.height / rect.height)
            };
        }

        const startDrawing = (e) => {
            e.preventDefault();
            isDrawing = true;
            resizeCanvasToDisplaySize();
            const pos = getMousePos(canvasPad, e);
            ctxPad.beginPath();
            ctxPad.moveTo(pos.x, pos.y);
            dom.statusIndicator.classList.add('bg-white', 'shadow-[0_0_8px_#fff]');
            dom.statusIndicator.classList.remove('bg-white/20');
        };

        const draw = (e) => {
            if (!isDrawing) return;
            e.preventDefault();
            const pos = getMousePos(canvasPad, e);
            ctxPad.lineTo(pos.x, pos.y);
            ctxPad.stroke();
        };

        const stopDrawing = (e) => {
            e.preventDefault();
            if (isDrawing) {
                ctxPad.closePath();
                isDrawing = false;
                dom.statusIndicator.classList.remove('bg-white', 'shadow-[0_0_8px_#fff]');
                dom.statusIndicator.classList.add('bg-white/20');
                captureHandwriting();
            }
        };

        canvasPad.addEventListener('mousedown', startDrawing);
        canvasPad.addEventListener('mousemove', draw);
        canvasPad.addEventListener('mouseup', stopDrawing);
        canvasPad.addEventListener('mouseout', stopDrawing);
        canvasPad.addEventListener('touchstart', startDrawing, { passive: false });
        canvasPad.addEventListener('touchmove', draw, { passive: false });
        canvasPad.addEventListener('touchend', stopDrawing, { passive: false });

        window.clearCanvas = () => {
            ctxPad.clearRect(0, 0, canvasPad.width, canvasPad.height);
            setupCanvasStyles();
            clearGlobalState();
        };

        window.captureHandwriting = () => {
            const tempCvs = document.createElement('canvas');
            tempCvs.width = canvasPad.width;
            tempCvs.height = canvasPad.height;
            const tCtx = tempCvs.getContext('2d');
            tCtx.fillStyle = '#000000';
            tCtx.fillRect(0, 0, tempCvs.width, tempCvs.height);
            tCtx.drawImage(canvasPad, 0, 0);

            const pixelData = ctxPad.getImageData(0, 0, canvasPad.width, canvasPad.height).data;
            let hasDrawn = false;
            for (let i = 0; i < pixelData.length; i += 4) {
                if (pixelData[i + 3] > 0) { hasDrawn = true; break; }
            }
            if (hasDrawn) {
                imageBase64 = tempCvs.toDataURL('image/png');
                fileMimeType = 'image/png';
                dom.ocrButton.disabled = false;
            } else {
                dom.ocrButton.disabled = true;
            }
        };

        window.switchMode = (mode) => {
            if (currentMode === mode) return;
            currentMode = mode;

            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`tab-${mode}`).classList.add('active');

            dom.modeUpload.classList.add('hidden');
            dom.modeHandwriting.classList.add('hidden');
            dom.modeCamera.classList.add('hidden');

            if (videoStream) {
                videoStream.getTracks().forEach(track => track.stop());
                videoStream = null;
            }

            clearGlobalState();
            ctxPad.clearRect(0, 0, canvasPad.width, canvasPad.height);

            if (mode === 'upload') {
                dom.modeUpload.classList.remove('hidden');
            } else if (mode === 'handwriting') {
                dom.modeHandwriting.classList.remove('hidden');
                setTimeout(() => {
                    resizeCanvasToDisplaySize();
                    setupCanvasStyles();
                }, 50);
            } else if (mode === 'camera') {
                dom.modeCamera.classList.remove('hidden');
                setupCamera();
            }
        };

        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(evt => {
            dom.dropArea.addEventListener(evt, e => { e.preventDefault(); e.stopPropagation(); }, false);
        });
        ['dragenter', 'dragover'].forEach(evt => dom.dropArea.addEventListener(evt, () => dom.dropArea.classList.add('active'), false));
        ['dragleave', 'drop'].forEach(evt => dom.dropArea.addEventListener(evt, () => dom.dropArea.classList.remove('active'), false));
        dom.dropArea.addEventListener('drop', (e) => {
            if (e.dataTransfer.files.length) handleFileChange({ target: { files: e.dataTransfer.files } });
        }, false);

        window.handleFileChange = (event) => {
            const file = event.target.files[0];
            if (!file || !file.type.startsWith('image/')) {
                showError("Invalid Media Format");
                return;
            }
            fileMimeType = file.type;
            const reader = new FileReader();
            reader.onload = (e) => {
                imageBase64 = e.target.result;
                dom.imagePreview.src = imageBase64;
                dom.dropArea.classList.add('hidden');
                dom.imagePreviewContainer.classList.remove('hidden');
                dom.ocrButton.disabled = false;
                hideResults();
                dom.statusIndicator.classList.add('bg-white', 'shadow-[0_0_8px_#fff]');
                dom.statusIndicator.classList.remove('bg-white/20');
            };
            reader.readAsDataURL(file);
        };

        window.setupCamera = async () => {
            dom.snapshotButton.disabled = true;
            dom.cameraStatus.textContent = "CONNECTING LINK";
            try {
                videoStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                dom.videoElement.srcObject = videoStream;
                dom.videoElement.onloadedmetadata = () => {
                    dom.snapshotButton.disabled = false;
                    dom.cameraStatus.textContent = "OPTICS READY";
                    dom.statusIndicator.classList.add('bg-white', 'shadow-[0_0_8px_#fff]');
                    dom.statusIndicator.classList.remove('bg-white/20');
                };
            } catch (err) {
                dom.cameraStatus.textContent = "ACCESS DENIED";
                showError("Optics Access Denied.");
            }
        };

        window.takeSnapshot = () => {
            if (!videoStream) return;

            dom.snapshotOverlay.classList.remove('hidden');
            dom.snapshotOverlay.style.opacity = '1';
            setTimeout(() => {
                dom.snapshotOverlay.style.transition = 'opacity 0.2s cubic-bezier(0.19, 1, 0.22, 1)';
                dom.snapshotOverlay.style.opacity = '0';
                setTimeout(() => { dom.snapshotOverlay.classList.add('hidden'); dom.snapshotOverlay.style.transition = ''; }, 200);
            }, 50);

            const video = dom.videoElement;
            const canvas = dom.cameraCanvas;
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            imageBase64 = canvas.toDataURL('image/jpeg', 0.9);
            fileMimeType = 'image/jpeg';
            dom.ocrButton.disabled = false;
            dom.cameraStatus.textContent = "NODE CAPTURED";
            setTimeout(() => { dom.cameraStatus.textContent = "OPTICS READY"; }, 2000);
        };

        window.clearGlobalState = () => {
            imageBase64 = null; fileMimeType = null; dom.fileInput.value = '';
            dom.imagePreviewContainer.classList.add('hidden'); dom.imagePreview.src = '';
            if (currentMode === 'upload') dom.dropArea.classList.remove('hidden');
            dom.ocrButton.disabled = true; dom.errorDisplay.classList.add('hidden');
            dom.statusIndicator.classList.remove('bg-white', 'shadow-[0_0_8px_#fff]');
            dom.statusIndicator.classList.add('bg-white/20');
            hideResults();
        };

        function hideResults() {
            dom.results.textContent = '';
            dom.results.classList.add('hidden');
            dom.emptyState.classList.remove('hidden');
            dom.copyButton.disabled = true;
        }

        window.showError = (msg) => {
            dom.errorText.innerHTML = msg; dom.errorDisplay.classList.remove('hidden');
            setTimeout(() => { dom.errorDisplay.classList.add('hidden'); }, 4000);
        };

        window.runOCR = async () => {
            if (currentMode === 'handwriting') captureHandwriting();
            if (!imageBase64) return;

            dom.ocrButton.disabled = true;
            const ogBtnHtml = dom.ocrButton.innerHTML;
            dom.ocrButton.innerHTML = `<div class="spinner"></div><span class="ml-3">Processing...</span>`;

            dom.results.classList.add('hidden');
            dom.emptyState.classList.add('hidden');
            dom.loading.classList.remove('hidden');
            dom.copyButton.disabled = true;
            dom.errorDisplay.classList.add('hidden');

            try {
                const result = await fetch(API_URL, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ imageBase64: imageBase64, fileMimeType: fileMimeType })
                });

                if (!result.ok) throw new Error("Processing Fault");

                const data = await result.json();
                const extractedText = data.extractedText || "NO EXTRACTABLE DATA CLUSTERS DETECTED.";

                dom.results.textContent = extractedText.replace(/\\n/g, '\n');
                dom.loading.classList.add('hidden');
                dom.results.classList.remove('hidden');

                if (extractedText && extractedText !== "NO EXTRACTABLE DATA CLUSTERS DETECTED.") {
                    dom.copyButton.disabled = false;
                }

            } catch (error) {
                dom.loading.classList.add('hidden');
                dom.emptyState.classList.remove('hidden');
                showError("Data Extraction Fault | Verify Uplink");
            } finally {
                dom.ocrButton.innerHTML = ogBtnHtml;
                dom.ocrButton.disabled = false;
            }
        };

        window.copyText = () => {
            const txt = dom.results.textContent;
            if (!txt) return;
            navigator.clipboard.writeText(txt).then(() => {
                const btn = dom.copyButton;
                const originalHtml = btn.innerHTML;
                btn.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2"><polyline points="20 6 9 17 4 12"></polyline></svg>`;
                btn.classList.add('bg-white/10');
                setTimeout(() => {
                    btn.innerHTML = originalHtml;
                    btn.classList.remove('bg-white/10');
                }, 2000);
            });
        };

        window.addEventListener('load', () => {
            resizeCanvasToDisplaySize();
            switchMode('handwriting');
        });
    </script>
</body>

</html>
